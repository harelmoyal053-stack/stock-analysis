name: Probe data fields
on:
  push:
    paths: [probe/p.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/p.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out.json && git commit -m "Probe result" && for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
