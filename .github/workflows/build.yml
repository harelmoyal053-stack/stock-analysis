name: Build site

# Compiles src/app.jsx into a small, fast app.js. If the code has an error,
# the build fails and the live site keeps the last working version.
on:
  push:
    paths:
      - src/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile
        run: |
          npx --yes esbuild@0.24.0 src/app.jsx --loader:.jsx=jsx \
            --jsx-factory=React.createElement --jsx-fragment=React.Fragment \
            --minify --target=es2019 --outfile=app.js --log-level=warning
          ls -la app.js
          sed -i "s/app\.js?v=[A-Za-z0-9]*/app.js?v=${GITHUB_SHA::8}/" index.html
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Build app.js"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
