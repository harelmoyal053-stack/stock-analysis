<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0f2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>ניתוח מניות</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="מניות">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  #boot{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#6b7280;background:#f0f2f5}
  @media (prefers-color-scheme: dark){html:not([data-theme="light"]) #boot,html:not([data-theme="light"]) body{background:#0b0f17;color:#94a3b8}}
  html[data-theme="dark"] #boot,html[data-theme="dark"] body{background:#0b0f17;color:#94a3b8}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
</head>
<body>
<div id="root"><div id="boot">טוען...</div></div>
<script>
  // Show a readable message instead of a stuck screen if something fails to load
  function showErr(msg){var b=document.getElementById("boot");if(b){b.style.flexDirection="column";b.style.gap="8px";b.style.padding="24px";b.style.textAlign="center";b.innerHTML="<b>משהו לא נטען</b><span style=\"font-size:12px;direction:ltr\"></span><button onclick=\"location.reload()\" style=\"margin-top:8px;padding:10px 18px;border:0;border-radius:12px;background:#22c55e;color:#fff;font-weight:700\">נסה שוב</button>";b.querySelector("span").textContent=msg;}}
  window.addEventListener("error",function(e){if(e.target&&e.target.src&&e.target.src.indexOf("app.js")>-1)return;showErr(e.message||"load error");},true);
  setTimeout(function(){if(document.getElementById("boot"))showErr("הטעינה לוקחת יותר מדי זמן — בדוק חיבור לאינטרנט");},20000);
</script>
<script>
  // Fast path: the pre-built app. If it is missing, compile the source in the browser instead.
  function loadDev(){
    var b=document.createElement("script");
    b.src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js";
    b.onload=function(){fetch("src/app.jsx?v="+Date.now()).then(function(r){return r.text()}).then(function(src){
      (0,eval)(Babel.transform(src,{presets:["react"]}).code);
    }).catch(function(e){showErr(String(e))});};
    document.body.appendChild(b);
  }
</script>
<script src="app.js?v=6206ee9f" onerror="loadDev()"></script>
</body>
</html>
